[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "routeweaver"
version = "0.1.0"
description = "Local-first logistics order and fleet dispatch platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
]

[tool.setuptools.packages.find]
include = ["routeweaver*"]

[tool.setuptools.package-data]
routeweaver = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

